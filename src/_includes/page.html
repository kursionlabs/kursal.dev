+++
layout = "base.html"
+++
<div class="page-hero">
  <div class="shell">
    <p class="eyebrow">{{ page.eyebrow or 'Explore Kursal' }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.intro %}<p class="page-intro">{{ page.intro }}</p>{% endif %}
  </div>
</div>
<div class="shell content-grid">
  <aside class="page-sidebar" aria-label="Section navigation">
    <span class="sidebar-label">Learn</span>
    <a href="/start/" {% if page.url == '/start/' %}aria-current="page"{% endif %}>Get started</a>
    <a href="/tour/" {% if page.url == '/tour/' %}aria-current="page"{% endif %}>Language tour</a>
    <a href="/walkthroughs/" {% if page.url == '/walkthroughs/' %}aria-current="page"{% endif %}>Walkthroughs</a>
    <span class="sidebar-label">Understand</span>
    <a href="/ideas/" {% if page.url == '/ideas/' %}aria-current="page"{% endif %}>The ideas</a>
    <a href="/compiler/" {% if page.url == '/compiler/' %}aria-current="page"{% endif %}>The compiler</a>
    <a href="/story/" {% if page.url == '/story/' %}aria-current="page"{% endif %}>How Kursal came to be</a>
    <span class="sidebar-label">Reference</span>
    <a href="/source/" {% if page.url == '/source/' %}aria-current="page"{% endif %}>Source map</a>
  </aside>
  <article class="prose">{{ content | safe }}</article>
</div>
