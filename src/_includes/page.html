+++
layout = "base.html"
+++
<div class="page-hero">
  <div class="shell">
    <p class="eyebrow">{{ page.eyebrow or 'Explore Kursal' }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.intro %}<p class="page-intro">{{ page.intro }}</p>{% endif %}
  </div>
</div>
<div class="shell content-grid">
  <aside class="page-sidebar" aria-label="Section navigation">
    <span class="sidebar-label">Read next</span>
    <a href="/start/" {% if page.url == '/start/' %}aria-current="page"{% endif %}>Build</a>
    <a href="/design/" {% if page.url == '/design/' %}aria-current="page"{% endif %}>Design model</a>
    <a href="/language/" {% if page.url == '/language/' %}aria-current="page"{% endif %}>Language tour</a>
    <a href="/compiler/" {% if page.url == '/compiler/' %}aria-current="page"{% endif %}>Compiler architecture</a>
    <a href="/resources/" {% if page.url == '/resources/' %}aria-current="page"{% endif %}>Source map</a>
  </aside>
  <article class="prose">{{ content | safe }}</article>
</div>
